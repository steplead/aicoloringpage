name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - multilanguages
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Full pipeline: `vercel build` (via next-on-pages) produces `.vercel/output` with
      # edge functions. Using only `next build` + `--skip-build` skips that step and deploys
      # static assets without SSR/API routes (broken site).
      - name: Build for Cloudflare Pages
        run: npx @cloudflare/next-on-pages@1.13.16
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: aicoloringpage
          directory: .vercel/output/static
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.56.0'
