#:schema node_modules/wrangler/config-schema.json
name = "aicoloringpage"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Shared counters for /api/generate and /api/story/generate.
# Create it once, then replace id with the printed namespace id:
#   npx wrangler kv namespace create RATE_KV
# Local `wrangler pages dev` uses this binding from disk; production deploy
# needs the real id before the Worker will see RATE_KV.
[[kv_namespaces]]
binding = "RATE_KV"
id = "8a96b0f94044477080795429ca4021ad"

# Workers AI. One binding per project. Local `wrangler pages dev` calls the
# real account API and can incur Workers AI usage.
[ai]
binding = "AI"

# Mirror existing dashboard hostname allowlists; do not change remote configuration.
[vars]
TURNSTILE_HOSTNAMES = "ai-coloringpage.com"

[env.preview.vars]
TURNSTILE_HOSTNAMES = "example.com"

[[env.preview.kv_namespaces]]
binding = "RATE_KV"
id = "8a96b0f94044477080795429ca4021ad"

[env.preview.ai]
binding = "AI"
